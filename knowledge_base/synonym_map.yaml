# 中医望诊 · 临床口语 → 经典经方体系标准术语 别名词典
# ==========================================================================
# 用途：grep_search 检索前，先把患者口语描述展开为知识库里实际出现的标准术语，
#       再做 OR 检索。例如"便软" → 检索 "便软|下利|便溏|..."。
#
# 格式约束（synonym_loader 的手写回退解析器只认这一种）：
#   - 顶层键：行尾一个冒号，冒号后无内容。键 = 临床口语词。
#   - 值：缩进的 block 序列，每行 "- 标准术语"。
#   - 不用 flow 风格 [a, b]、不用引号、不用锚点。注释以 # 开头。
#   （环境装了 PyYAML 时优先用 PyYAML 解析，可兼容任意合法 YAML。）
#
# 术语选择原则：
#   1. 保留任务指定的基础映射（即使个别术语当前未在 KB 出现，亦为标准经方术语，
#      知识库扩充后即命中，OR 展开下零代价）。
#   2. 补充经 grep 验证确实出现在 knowledge_base/ 中的术语，保证当下即可召回。
#   3. 原查询词总由 expand() 自动并入检索模式，故无需在此重复列出原词。
# ==========================================================================

